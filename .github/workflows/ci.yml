name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Quality gates
        shell: pwsh
        run: ./eng/mw.ps1 all only
      - name: Quality logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mywindows-quality
          path: artifacts/quality/
          if-no-files-found: ignore
          retention-days: 7
